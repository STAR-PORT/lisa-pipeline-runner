apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: compute-simulate-module
  namespace: default

spec:
  templates:

  - name: compute-simulate

    inputs:
      parameters:
      - name: duration
        default: "300"

      - name: output_file
        default: "/users/admin/simulation.txt"

      - name: partition
        default: "dev-x86"

      - name: cpu
        default: "2"

      - name: memory
        default: "2Gi"

      - name: user
        default: "admin"

    resource:
      action: create
      setOwnerReference: true
      successCondition: status.succeeded == 1
      failureCondition: status.failed == 1
      manifest: |
        apiVersion: batch/v1
        kind: Job
        metadata:
          generateName: argo-compute-simulate-
          namespace: default
          resourceVersion: "1"
        spec:
          ttlSecondsAfterFinished: 300
          template:
            metadata:
              annotations:
                slurm-job.vk.io/flags: >-
                  --account=eehpc-dev-2026d02-075x
                  --partition={{inputs.parameters.partition}}
                  --cpus-per-task={{inputs.parameters.cpu}}
                  --mem={{inputs.parameters.memory}}
            spec:
              nodeSelector:
                kubernetes.io/hostname: interlink-node
              tolerations:
              - key: virtual-node.interlink/no-schedule
                operator: Exists
              restartPolicy: Never
              automountServiceAccountToken: false
              containers:
              - name: main
                image: ubuntu:22.04
                command: ["bash", "-c"]
                args:
                - |
                  set -e
                  echo "compute module: simulation"

                  END=$((SECONDS + {{inputs.parameters.duration}}))

                  while [ $SECONDS -lt $END ]; do
                    X=$((12345 * 67890))
                  done

                  echo "completed after {{inputs.parameters.duration}} seconds" \
                    > "{{inputs.parameters.output_file}}"

                env:
                - name: ARGO_USER
                  value: "{{inputs.parameters.user}}"
                resources:
                  requests:
                    cpu: "1"
                    memory: "512Mi"
                  limits:
                    cpu: "1"
                    memory: "512Mi"