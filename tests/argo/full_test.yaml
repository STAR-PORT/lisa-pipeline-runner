apiVersion: argoproj.io/v1alpha1
kind: Workflow

metadata:
  namespace: default
  generateName: hybrid-hpc-pipeline-

spec:
  entrypoint: pipeline

  templates:

  - name: pipeline

    dag:

      tasks:

        #
        # INPUT SYNC
        #

        - name: input-sync

          templateRef:
            namespace: default
            name: sync-module
            template: sync

          arguments:
            parameters:
              - name: input_uri
                value: /users/admin/case-01

        #
        # COMPUTE PART 1
        #

        - name: compute-part1

          dependencies:
            - input-sync

          templateRef:
            namespace: default
            name: compute-module
            template: compute

          arguments:
            parameters:

              - name: partition
                value: dev-x86

              - name: cpu
                value: "4"

              - name: memory
                value: "8Gi"

              - name: command
                value: |
                  set -e

                  echo "=== PART 1 ==="

                  mkdir -p "/users/admin/run-01"

                  cp -r \
                    /users/admin/case-01 \
                    ./input

                  echo "processing stage 1"

                  sleep 30

                  echo "checkpoint-data" \
                    > "/users/admin/run-01/checkpoint.txt"

        #
        # CHECKPOINT SYNC
        #

        - name: checkpoint-sync

          dependencies:
            - compute-part1

          templateRef:
            namespace: default
            name: sync-module
            template: sync

          arguments:
            parameters:
              - name: output_uri
                value: /users/admin/run-01

        #
        # COMPUTE PART 2
        #

        - name: compute-part2

          dependencies:
            - checkpoint-sync

          templateRef:
            namespace: default
            name: compute-module
            template: compute

          arguments:
            parameters:

              - name: partition
                value: dev-x86

              - name: cpu
                value: "4"

              - name: memory
                value: "8Gi"

              - name: command
                value: |
                  set -e

                  echo "=== PART 2 ==="

                  mkdir -p "/users/admin/out-01"

                  echo "final-result" \
                    > "/users/admin/out-01/final.txt"

                  sleep 20

        #
        # FINAL SYNC
        #

        - name: final-sync

          dependencies:
            - compute-part2

          templateRef:
            namespace: default
            name: sync-module
            template: sync

          arguments:
            parameters:
              - name: output_uri
                value: /results/out-01