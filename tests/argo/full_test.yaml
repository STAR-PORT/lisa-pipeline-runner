apiVersion: argoproj.io/v1alpha1
kind: Workflow

metadata:
  namespace: default
  generateName: hybrid-hpc-pipeline-

spec:
  entrypoint: pipeline

  templates:

  - name: pipeline

    dag:

      tasks:

        #
        # INPUT SYNC
        #

        - name: input-sync

          templateRef:
            namespace: default
            name: sync-module
            template: sync

          arguments:
            parameters:
              - name: input_uri
                value: /users/admin/case-01
              - name: user
                value: admin

        #
        # COMPUTE PART 1
        #

        - name: compute-part1

          dependencies:
            - input-sync

          templateRef:
            namespace: default
            name: compute-module
            template: compute

          arguments:
            parameters:

              - name: partition
                value: dev-x86

              - name: cpu
                value: "4"

              - name: memory
                value: "8Gi"

              - name: user
                value: admin

              - name: text
                value: "This is the first compute step."

              - name: file
                value: /admin/case-01/checkpoint.txt

        #
        # CHECKPOINT SYNC
        #

        - name: checkpoint-sync

          dependencies:
            - compute-part1

          templateRef:
            namespace: default
            name: sync-module
            template: sync

          arguments:
            parameters:
              - name: output_uri
                value: /users/admin/case-01
              - name: user
                value: admin

        #
        # COMPUTE PART 2
        #

        - name: compute-part2

          dependencies:
            - checkpoint-sync

          templateRef:
            namespace: default
            name: compute-module
            template: compute

          arguments:
            parameters:

              - name: partition
                value: dev-x86

              - name: cpu
                value: "4"

              - name: memory
                value: "8Gi"

              - name: user
                value: admin

              - name: text
                value: "This is the final compute step."

              - name: file
                value: /admin/case-01/final.txt

        #
        # FINAL SYNC
        #

        - name: final-sync

          dependencies:
            - compute-part2

          templateRef:
            namespace: default
            name: sync-module
            template: sync

          arguments:
            parameters:
              - name: output_uri
                value: /users/admin/case-01
              - name: user
                value: admin