# This workflow tests the checkpointing and syncing of intermediate outputs between compute steps.
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  namespace: default
  generateName: test-07-checkpoint-sync-
  labels:
    test: "07-checkpoint-sync"

spec:
  entrypoint: pipeline

  templates:
  - name: pipeline
    dag:
      tasks:

      - name: input-sync
        templateRef:
          name: sync-module
          template: sync
          clusterScope: true
        arguments:
          parameters:
          - name: input_uri
            value: /users/admin/test-07
          - name: user
            value: admin

      - name: compute-write
        dependencies: [input-sync]
        templateRef:
          name: compute-write-module
          template: compute-write
          clusterScope: true
        arguments:
          parameters:
          - name: text
            value: "test-07-file"
          - name: file
            value: /users/admin/test-07/file-1.txt
          - name: cpu
            value: "2"
          - name: memory
            value: "2Gi"
          - name: user
            value: admin

      - name: checkpoint-sync-1
        dependencies: [compute-write]
        templateRef:
          name: sync-module
          template: sync
          clusterScope: true
        arguments:
          parameters:
          - name: output_uri
            value: /users/admin/test-07
          - name: user
            value: admin

      - name: compute-transform
        dependencies: [checkpoint-sync-1]
        templateRef:
          name: compute-transform-module
          template: compute-transform
          clusterScope: true
        arguments:
          parameters:
          - name: input_file
            value: /users/admin/test-07/file-1.txt
          - name: output_file
            value: /users/admin/test-07/file-2.txt
          - name: cpu
            value: "2"
          - name: memory
            value: "2Gi"
          - name: user
            value: admin

      - name: checkpoint-sync-2
        dependencies: [compute-transform]
        templateRef:
          name: sync-module
          template: sync
          clusterScope: true
        arguments:
          parameters:
          - name: output_uri
            value: /users/admin/test-07
          - name: user
            value: admin

      - name: compute-aggregate
        dependencies: [checkpoint-sync-2]
        templateRef:
          name: compute-aggregate-module
          template: compute-aggregate
          clusterScope: true
        arguments:
          parameters:
          - name: input_dir
            value: /users/admin/test-07
          - name: output_file
            value: /users/admin/test-07/file-3.txt
          - name: cpu
            value: "2"
          - name: memory
            value: "2Gi"
          - name: user
            value: admin

      - name: output-sync
        dependencies: [compute-aggregate]
        templateRef:
          name: sync-module
          template: sync
          clusterScope: true
        arguments:
          parameters:
          - name: output_uri
            value: /users/admin/test-07
          - name: user
            value: admin