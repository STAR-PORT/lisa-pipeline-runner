apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  namespace: default
  generateName: test-11-interlink-stress-
  labels:
    test: "11-interlink-stress"
spec:
  entrypoint: pipeline
  artifactRepositoryRef:
    configMap: artifact-repositories-hpc
    key: garage-hpc
  podGC:
    strategy: OnPodSuccess
  arguments:
    parameters:
    - name: slurm-account
      value: "F202500007HPCVLABUPORTOX"
    - name: slurm-partition
      value: "normal-x86"
    - name: cpus-per-task
      value: "1"
    - name: memory
      value: "256M"
    - name: vm-bytes
      value: "128M"
    - name: duration
      value: "30s"
    - name: kubernetes-api-host
      value: "10.1.0.2"
    - name: kubernetes-api-port
      value: "19002"
  templates:
  - name: pipeline
    dag:
      tasks:
      - name: prepare
        template: prepare-input

      - name: stress
        dependencies: [prepare]
        template: interlink-stress
        arguments:
          artifacts:
          - name: input-data
            from: "{{tasks.prepare.outputs.artifacts.input-data}}"

      - name: verify
        dependencies: [stress]
        template: verify-output
        arguments:
          artifacts:
          - name: output-data
            from: "{{tasks.stress.outputs.artifacts.output-data}}"

  - name: prepare-input
    metadata:
      annotations:
        slurm-job.vk.io/flags: >-
          --account={{workflow.parameters.slurm-account}}
          --partition={{workflow.parameters.slurm-partition}}
          --cpus-per-task={{workflow.parameters.cpus-per-task}}
          --mem={{workflow.parameters.memory}}
    outputs:
      artifacts:
      - name: input-data
        path: /tmp/input.txt
        archive:
          none: {}
        s3:
          key: "{{workflow.name}}/input.txt"
    nodeSelector:
      kubernetes.io/hostname: interlink-node
    tolerations:
    - key: virtual-node.interlink/no-schedule
      operator: Exists
    podSpecPatch: |
      hostAliases:
      - ip: "{{workflow.parameters.kubernetes-api-host}}"
        hostnames:
        - kubernetes.default.svc
      initContainers:
      - name: init
        env:
        - name: KUBERNETES_SERVICE_HOST
          value: kubernetes.default.svc
        - name: KUBERNETES_SERVICE_PORT
          value: "{{workflow.parameters.kubernetes-api-port}}"
        - name: KUBERNETES_SERVICE_PORT_HTTPS
          value: "{{workflow.parameters.kubernetes-api-port}}"
      containers:
      - name: main
        env:
        - name: KUBERNETES_SERVICE_HOST
          value: kubernetes.default.svc
        - name: KUBERNETES_SERVICE_PORT
          value: "{{workflow.parameters.kubernetes-api-port}}"
        - name: KUBERNETES_SERVICE_PORT_HTTPS
          value: "{{workflow.parameters.kubernetes-api-port}}"
      - name: wait
        env:
        - name: KUBERNETES_SERVICE_HOST
          value: kubernetes.default.svc
        - name: KUBERNETES_SERVICE_PORT
          value: "{{workflow.parameters.kubernetes-api-port}}"
        - name: KUBERNETES_SERVICE_PORT_HTTPS
          value: "{{workflow.parameters.kubernetes-api-port}}"
    container:
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
      - "printf 'garage artifact round-trip input\\n' > /tmp/input.txt"
      resources:
        requests:
          cpu: "{{workflow.parameters.cpus-per-task}}"
          memory: "{{workflow.parameters.memory}}"
        limits:
          cpu: "{{workflow.parameters.cpus-per-task}}"
          memory: "{{workflow.parameters.memory}}"

  - name: interlink-stress
    inputs:
      artifacts:
      - name: input-data
        path: /tmp/input.txt
    metadata:
      annotations:
        slurm-job.vk.io/flags: >-
          --account={{workflow.parameters.slurm-account}}
          --partition={{workflow.parameters.slurm-partition}}
          --cpus-per-task={{workflow.parameters.cpus-per-task}}
          --mem={{workflow.parameters.memory}}
    outputs:
      artifacts:
      - name: output-data
        path: /tmp/output.txt
        archive:
          none: {}
        s3:
          key: "{{workflow.name}}/output.txt"
    nodeSelector:
      kubernetes.io/hostname: interlink-node
    tolerations:
    - key: virtual-node.interlink/no-schedule
      operator: Exists
    podSpecPatch: |
      hostAliases:
      - ip: "{{workflow.parameters.kubernetes-api-host}}"
        hostnames:
        - kubernetes.default.svc
      initContainers:
      - name: init
        env:
        - name: KUBERNETES_SERVICE_HOST
          value: kubernetes.default.svc
        - name: KUBERNETES_SERVICE_PORT
          value: "{{workflow.parameters.kubernetes-api-port}}"
        - name: KUBERNETES_SERVICE_PORT_HTTPS
          value: "{{workflow.parameters.kubernetes-api-port}}"
      containers:
      - name: main
        env:
        - name: KUBERNETES_SERVICE_HOST
          value: kubernetes.default.svc
        - name: KUBERNETES_SERVICE_PORT
          value: "{{workflow.parameters.kubernetes-api-port}}"
        - name: KUBERNETES_SERVICE_PORT_HTTPS
          value: "{{workflow.parameters.kubernetes-api-port}}"
      - name: wait
        env:
        - name: KUBERNETES_SERVICE_HOST
          value: kubernetes.default.svc
        - name: KUBERNETES_SERVICE_PORT
          value: "{{workflow.parameters.kubernetes-api-port}}"
        - name: KUBERNETES_SERVICE_PORT_HTTPS
          value: "{{workflow.parameters.kubernetes-api-port}}"
    container:
      image: colinianking/stress-ng
      command: ["/bin/bash", "-c"]
      args:
      - |
        set -euo pipefail
        test "$(cat /tmp/input.txt)" = "garage artifact round-trip input"
        echo "Starting stress test on $(hostname)"
        stress-ng \
          --cpu 1 \
          --cpu-load 100 \
          --vm 1 \
          --vm-bytes "{{workflow.parameters.vm-bytes}}" \
          --timeout "{{workflow.parameters.duration}}" \
          --metrics-brief
        printf 'stress completed: %s\n' "$(date -u +%FT%TZ)" > /tmp/output.txt
      resources:
        requests:
          cpu: "{{workflow.parameters.cpus-per-task}}"
          memory: "{{workflow.parameters.memory}}"
        limits:
          cpu: "{{workflow.parameters.cpus-per-task}}"
          memory: "{{workflow.parameters.memory}}"

  - name: verify-output
    inputs:
      artifacts:
      - name: output-data
        path: /tmp/output.txt
    metadata:
      annotations:
        slurm-job.vk.io/flags: >-
          --account={{workflow.parameters.slurm-account}}
          --partition={{workflow.parameters.slurm-partition}}
          --cpus-per-task={{workflow.parameters.cpus-per-task}}
          --mem={{workflow.parameters.memory}}
    nodeSelector:
      kubernetes.io/hostname: interlink-node
    tolerations:
    - key: virtual-node.interlink/no-schedule
      operator: Exists
    podSpecPatch: |
      hostAliases:
      - ip: "{{workflow.parameters.kubernetes-api-host}}"
        hostnames:
        - kubernetes.default.svc
      initContainers:
      - name: init
        env:
        - name: KUBERNETES_SERVICE_HOST
          value: kubernetes.default.svc
        - name: KUBERNETES_SERVICE_PORT
          value: "{{workflow.parameters.kubernetes-api-port}}"
        - name: KUBERNETES_SERVICE_PORT_HTTPS
          value: "{{workflow.parameters.kubernetes-api-port}}"
      containers:
      - name: main
        env:
        - name: KUBERNETES_SERVICE_HOST
          value: kubernetes.default.svc
        - name: KUBERNETES_SERVICE_PORT
          value: "{{workflow.parameters.kubernetes-api-port}}"
        - name: KUBERNETES_SERVICE_PORT_HTTPS
          value: "{{workflow.parameters.kubernetes-api-port}}"
      - name: wait
        env:
        - name: KUBERNETES_SERVICE_HOST
          value: kubernetes.default.svc
        - name: KUBERNETES_SERVICE_PORT
          value: "{{workflow.parameters.kubernetes-api-port}}"
        - name: KUBERNETES_SERVICE_PORT_HTTPS
          value: "{{workflow.parameters.kubernetes-api-port}}"
    container:
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
      - "grep -q '^stress completed:' /tmp/output.txt && cat /tmp/output.txt"
      resources:
        requests:
          cpu: "{{workflow.parameters.cpus-per-task}}"
          memory: "{{workflow.parameters.memory}}"
        limits:
          cpu: "{{workflow.parameters.cpus-per-task}}"
          memory: "{{workflow.parameters.memory}}"