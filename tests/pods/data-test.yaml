apiVersion: v1
kind: Pod

metadata:
  name: cache-test

  annotations:
    slurm-job.vk.io/flags: "--account=eehpc-dev-2026d02-075x --partition=dev-x86"

spec:
  automountServiceAccountToken: false

  nodeSelector:
    kubernetes.io/hostname: interlink-node

  tolerations:
    - key: virtual-node.interlink/no-schedule
      operator: Exists

  restartPolicy: Never

  containers:
    - name: simulation

      image: ubuntu:22.04

      env:
        - name: INPUT_URI
          value: "datasets/test-input"
        - name: OUTPUT_URI
          value: "results"

      command: ["bash", "-c"]

      args:
        - |
          set -euo pipefail

          echo "=== INPUT CACHE ==="

          ls -lah "$INPUT_CACHE_DIR"

          echo "=== JOB DIR ==="

          echo "$INTERLINK_JOB_DIR"

          mkdir -p "$INTERLINK_JOB_DIR/output"

          echo "=== WRITING OUTPUT ==="

          for i in $(seq 1 10); do

            echo "step=$i time=$(date)" \
              >> "$INTERLINK_JOB_DIR/output/results.txt"

            sleep 5
          done

          echo "=== DONE ==="

      resources:
        requests:
          cpu: "1"
          memory: "1Gi"

        limits:
          cpu: "1"
          memory: "1Gi"